
openapi: 3.0.3

info:
  title: TODO API
  description: >
    REST API for managing TODO tasks, including status changes, archiving,
    restoration, bulk deletion, and audit history. X-User-Id identifies the
    audit actor supplied by the client and does not authenticate that user.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: TODOs
    description: TODO task operations
  - name: Audit
    description: TODO audit history
  - name: Users
    description: User operations

paths:
  /todos:
    post:
      tags: [TODOs]
      summary: Create a TODO
      operationId: createTodo
      parameters:
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodo'
      responses:
        '201':
          description: TODO created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [TODOs]
      summary: Retrieve active TODOs
      description: Returns non-archived TODOs with pagination and sorting.
      operationId: listTodos
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sort_by
          in: query
          description: Sort by status (completed boolean) or creation date.
          schema:
            type: string
            enum: [status, created_at]
            default: created_at
        - name: order
          in: query
          description: Sort direction
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Paginated active TODOs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /todos/completed:
    delete:
      tags: [TODOs]
      summary: Delete all completed TODOs
      description: >
        Permanently deletes completed TODOs only. Pending TODOs remain.
        The audit history of deleted TODOs must be retained.
      operationId: deleteCompletedTodos
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: Bulk deletion completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /todos/archived:
    get:
      tags: [TODOs]
      summary: Retrieve archived TODOs
      operationId: listArchivedTodos
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [status, created_at]
            default: created_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Paginated archived TODOs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /todos/{id}:
    parameters:
      - $ref: '#/components/parameters/TodoId'

    get:
      tags: [TODOs]
      summary: Retrieve a TODO by ID
      operationId: getTodo
      responses:
        '200':
          description: TODO details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/TodoNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags: [TODOs]
      summary: Replace the editable fields of a TODO
      description: >
        Replaces title and description. Both fields must be supplied.
        Send description as null to clear it. ID and system-managed fields
        remain unchanged.
      operationId: updateTodo
      parameters:
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodo'
      responses:
        '200':
          description: TODO updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/TodoNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [TODOs]
      summary: Partially update a TODO
      description: Updates only the supplied editable fields.
      operationId: patchTodo
      parameters:
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTodo'
      responses:
        '200':
          description: TODO updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/TodoNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [TODOs]
      summary: Permanently delete a TODO
      description: >
        Deletes the TODO but retains its audit history, accessible through
        GET /todos/{id}/history using the original TODO ID.
      operationId: deleteTodo
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '204':
          description: TODO deleted successfully; audit history is retained.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/TodoNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /todos/{id}/status:
    parameters:
      - $ref: '#/components/parameters/TodoId'

    patch:
      tags: [TODOs]
      summary: Mark a TODO completed or pending
      operationId: updateTodoStatus
      parameters:
        - $ref: '#/components/parameters/XUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodoStatus'
      responses:
        '200':
          description: TODO status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/TodoNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /todos/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/TodoId'

    patch:
      tags: [TODOs]
      summary: Archive a TODO
      description: Archives a TODO without permanently deleting it.
      operationId: archiveTodo
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: TODO archived successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/TodoNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /todos/{id}/restore:
    parameters:
      - $ref: '#/components/parameters/TodoId'

    patch:
      tags: [TODOs]
      summary: Restore an archived TODO
      operationId: restoreTodo
      parameters:
        - $ref: '#/components/parameters/XUserId'
      responses:
        '200':
          description: TODO restored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/TodoNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /todos/{id}/history:
    parameters:
      - $ref: '#/components/parameters/TodoId'

    get:
      tags: [Audit]
      summary: Retrieve TODO audit history
      description: >
        Returns audit records newest first. History remains available after
        the TODO is permanently deleted. Returns an empty array if no records
        exist for the supplied ID.
      operationId: getTodoHistory
      responses:
        '200':
          description: Audit records for the specified TODO ID
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TodoAuditLog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users:
    post:
      tags: [Users]
      summary: Create a user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: User email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Unique user ID
        schema:
          type: integer
          format: int64
          minimum: 1

    get:
      tags: [Users]
      summary: Retrieve a user by ID
      operationId: getUser
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    TodoId:
      name: id
      in: path
      required: true
      description: Unique TODO ID
      schema:
        type: integer
        format: int64
        minimum: 1

    XUserId:
      name: X-User-Id
      in: header
      required: true
      description: >
        ID of the user performing this action, supplied by the client for
        audit logging. This header does not authenticate or authorize the user.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

    Page:
      name: page
      in: query
      required: false
      description: Page number, starting at 1
      schema:
        type: integer
        minimum: 1
        default: 1

    Limit:
      name: limit
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

  responses:
    BadRequest:
      description: Invalid request or input validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    TodoNotFound:
      description: TODO not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    CreateTodo:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Required TODO title; whitespace-only titles are invalid.
        description:
          type: string
          nullable: true
          description: Optional TODO description.

    UpdateTodo:
      type: object
      additionalProperties: false
      required: [title, description]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Required TODO title; whitespace-only titles are invalid.
        description:
          type: string
          nullable: true
          description: Required field; null clears the description.

    PatchTodo:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: New title; whitespace-only titles are invalid.
        description:
          type: string
          nullable: true
          description: New description, or null to clear it.

    UpdateTodoStatus:
      type: object
      additionalProperties: false
      required: [completed]
      properties:
        completed:
          type: boolean
          description: True means completed; false means pending.

    Todo:
      type: object
      required:
        - id
        - title
        - completed
        - is_archived
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        completed:
          type: boolean
        is_archived:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TodoList:
      type: object
      required: [items, page, limit, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Todo'
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
          description: Total matching TODOs across all pages.

    BulkDeleteResult:
      type: object
      required: [deleted_count, message]
      properties:
        deleted_count:
          type: integer
          minimum: 0
          description: Number of completed TODOs deleted.
        message:
          type: string

    CreateUser:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255

    User:
      type: object
      required: [id, name, email, created_at]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        created_at:
          type: string
          format: date-time

    TodoAuditLog:
      type: object
      required: [id, todo_id, user_id, action, created_at]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        todo_id:
          type: integer
          format: int64
          minimum: 1
          description: Original TODO ID, retained even after TODO deletion.
        user_id:
          type: integer
          format: int64
          minimum: 1
          description: User ID supplied for audit logging.
        action:
          type: string
          enum:
            - CREATED
            - UPDATED
            - STATUS_CHANGED
            - ARCHIVED
            - RESTORED
            - DELETED
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: TODO_NOT_FOUND
        message:
          type: string
          example: TODO with the specified ID was not found
